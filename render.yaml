services:
  - type: web
    name: adaptive-learning-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-20b
